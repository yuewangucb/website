<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact | YUE WANG GIBBONS</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

background:#111;
color:white;
font-family:"Cormorant Garamond", serif;
font-size:22px;
font-weight:400;
line-height:1.7;

}

img{
max-width:100%;
display:block;
}

a{

text-decoration:none;
color:white;

}

header{

position:fixed;
top:0;
left:0;
width:100%;

display:flex;
justify-content:space-between;
align-items:center;

padding:8px 60px;

z-index:100;

background:rgba(0,0,0,.2);
backdrop-filter:blur(4px);

}

.logo{

font-family:"Cormorant Garamond",serif;

font-size:32px;

letter-spacing:5px;

color:white;

text-decoration:none;

}

nav{

display:flex;
gap:34px;

font-family:"Cormorant Garamond", serif;
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;

}

nav a{
    color:white;
    opacity:0.9;
    transition:opacity .25s ease;
    text-decoration: none;
}

nav a:hover{
    text-decoration: underline;
    opacity:1;
}

.contact{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:140px 20px 80px;

}

.contact-title{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:25px;

    margin-bottom:30px;

}


.contact-title h1{

    margin-bottom:0;

}


.contact-social{

    display:flex;

    gap:25px;

    align-items:center;

}


.contact-social img{

    width:32px;

    height:32px;

    object-fit:contain;

    opacity:.75;

    transition:.3s;

}


.contact-social img:hover{

    opacity:1;

    transform:translateY(-3px);

}

.container{

    width:100%;

    max-width:700px;

    text-align:center;

}


h1{

    font-size:80px;

    font-weight:300;

    letter-spacing:4px;

    margin-bottom:30px;

}


.subtitle{

    font-size:26px;

    margin-bottom:60px;

    opacity:.85;

}


form{

    display:flex;

    flex-direction:column;

    gap:25px;

}


input,
textarea{

    width:100%;

    background:transparent;

    border:none;

    border-bottom:1px solid rgba(255,255,255,.5);

    padding:15px 5px;

    color:white;

    font-family:"Cormorant Garamond", serif;

    font-size:24px;

    outline:none;

}


textarea{

    height:160px;

    resize:none;

}



input::placeholder,
textarea::placeholder{

    color:rgba(255,255,255,.6);

}


.button{

    margin-top:30px;

    align-self:center;

    padding:15px 45px;

    background:transparent;

    border:1px solid white;

    color:white;

    font-family:"Cormorant Garamond", serif;

    font-size:22px;

    letter-spacing:3px;

    cursor:pointer;

    transition:.3s;

}


.button:hover{

    background:white;

    color:black;

}




footer{

    padding:40px 60px;

    color:#aaa;

    font-size:18px;

}


.footer-content{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:100%;

}


.social-links{

    display:flex;

    gap:25px;

    align-items:center;

}


.social-links img{

    width:28px;

    height:28px;

    object-fit:contain;

    opacity:.7;

    transition:.3s;

}


.social-links img:hover{

    opacity:1;

    transform:translateY(-3px);

}



@media(max-width:800px){

header{

    flex-direction:column;

    gap:15px;

}

h1{

    font-size:55px;

}

nav{

    flex-wrap:wrap;

    justify-content:center;

}

}


</style>

</head>


<body>


<header>

<a href="main.html" class="logo">
    YUE WANG
</a>

<nav>

<a href="media/resume.pdf">Resume</a>

<a href="music.html">Music</a>

<a href="contact.html">Contact</a>

</nav>


</header>



<section class="contact">


<div class="container">


<div class="contact-title">

    <div class="contact-social">

        <a href="https://www.linkedin.com/in/yue-wang-761b57135" target="_blank">
            <img src="media/InBug-White.png" alt="LinkedIn">
        </a>

        <a href="https://youtube.com/@yuewangpiano" target="_blank">
            <img src="media/yt_icon_white_digital.png" alt="YouTube">
        </a>

    </div>

    <h1>Contact Me</h1>

</div>


<a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSfIKPWoKjuGHiQt1KWjNOemj97V42i_7J-baLBB4Y1liMCY1Q/formResponse">

LEAVE A MESSAGE →

</a>


</form>


</div>


</section>


<footer>

<div class="footer-content">

    <div class="copyright">
        © 2026 Yue Wang
    </div>

   <div class="social-links">

    <a href="https://www.linkedin.com/in/yue-wang-761b57135" target="_blank">
        <img src="media/InBug-White.png" alt="LinkedIn">
    </a>

    <a href="https://youtube.com/@yuewangpiano" target="_blank">
        <img src="media/yt_icon_white_digital.png" alt="YouTube">
    </a>

    </div>

</div>

</footer>


</body>

</html>
